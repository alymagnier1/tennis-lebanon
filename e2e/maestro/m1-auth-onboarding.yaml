appId: com.tennislebanon.dev
name: M1 email authentication and onboarding
---
- launchApp:
    clearState: true
- tapOn: "Get started"
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- tapOn: "Send magic link"
- assertVisible: "Check your email"
# Set MAGIC_LINK from the local Supabase inbox before running this step.
- openLink: ${MAGIC_LINK}
- assertVisible: "Before you continue"
- tapOn: "I accept the Terms of Use, Privacy Notice and Community Rules"
- tapOn: "Continue"
- tapOn: "Display name"
- inputText: "Maestro Player"
- tapOn: "Birth year"
- inputText: "1990"
- tapOn: "I confirm that I am 18 or older"
- tapOn: "I can rally and play points"
- tapOn: "Continue"
- tapOn:
    text: "Pilot Central"
- tapOn: "Finish setup"
- assertVisible: "You're all set,"
- tapOn: "Start Playing"
- assertVisible: "Hello, Maestro Player"
